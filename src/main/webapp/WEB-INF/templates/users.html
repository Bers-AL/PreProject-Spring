<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Пользователи и машины</title>

    <style>
        :root{
            --bg:#0b1220;
            --card: rgba(255,255,255,.05);
            --card2: rgba(255,255,255,.035);
            --text:#e8eefc;
            --muted:#a9b7d0;
            --border:rgba(255,255,255,.12);
            --border2:rgba(255,255,255,.18);
            --shadow: 0 10px 25px rgba(0,0,0,.35);
            --accent:#6ea8fe;
            --danger:#ff6b6b;
            --radius:14px;
            --radius2:12px;
            --gap:16px;
        }
        *{ box-sizing:border-box; }
        body{
            margin:0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
            background:
                    radial-gradient(1200px 600px at 20% 0%, rgba(110,168,254,.18), transparent 60%),
                    radial-gradient(1000px 500px at 90% 10%, rgba(126,240,199,.14), transparent 55%),
                    var(--bg);
            color:var(--text);
        }
        .container{
            max-width: 1200px;
            margin: 0 auto;
            padding: 26px 16px 60px;
        }
        h1{ margin:0 0 12px; font-size: 22px; }
        a{ color: var(--accent); text-decoration:none; }
        a:hover{ text-decoration:underline; }

        .flash{
            margin: 10px 0 16px;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,.04);
            box-shadow: 0 6px 14px rgba(0,0,0,.25);
            font-size: 14px;
        }
        .flash.error{
            border-color: rgba(255,107,107,.35);
            background: rgba(255,107,107,.10);
            color: #ffd3d3;
        }
        .flash.success{
            border-color: rgba(126,240,199,.35);
            background: rgba(126,240,199,.10);
            color: #d8fff1;
        }

        .top-grid{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--gap);
            align-items: stretch;
            margin-bottom: var(--gap);
        }

        .card{
            background: linear-gradient(180deg, var(--card), var(--card2));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            min-height: 100%;
        }
        .card__head{
            padding: 14px 16px;
            background: rgba(0,0,0,.18);
            border-bottom: 1px solid var(--border);
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
        }
        .card__head h2{ margin:0; font-size: 16px; font-weight: 700; }
        .card__body{ padding: 16px; }

        .form{
            display:grid;
            gap: 12px;
        }
        .field{
            display:flex;
            flex-direction:column;
            gap:6px;
        }
        .field label{
            color: var(--muted);
            font-size: 12px;
        }
        input[type="text"], input[type="email"], input[type="number"]{
            width:100%;
            padding: 10px 10px;
            border-radius: 12px;
            border: 1px solid var(--border2);
            background: rgba(13,22,38,.65);
            color: var(--text);
            outline: none;
            transition: border-color .15s ease;
        }
        input:focus{
            border-color: rgba(110,168,254,.55);
            box-shadow: 0 0 0 4px rgba(110,168,254,.15);
        }

        .actions{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            align-items:center;
            justify-content:flex-start;
            margin-top: 4px;
        }

        .btn{
            appearance:none;
            border: 1px solid var(--border2);
            background: rgba(255,255,255,.06);
            color: var(--text);
            padding: 10px 12px;
            border-radius: 12px;
            cursor:pointer;
            font-weight: 650;
            font-size: 13px;
            transition: background .15s ease, border-color .15s ease, transform .06s ease;
            white-space:nowrap;
        }
        .btn:hover{
            background: rgba(255,255,255,.10);
            border-color: rgba(255,255,255,.22);
        }
        .btn:active{ transform: translateY(1px); }
        .btn-primary{
            background: rgba(110,168,254,.18);
            border-color: rgba(110,168,254,.40);
        }
        .btn-primary:hover{
            background: rgba(110,168,254,.26);
            border-color: rgba(110,168,254,.55);
        }
        .btn-danger{
            background: rgba(255,107,107,.14);
            border-color: rgba(255,107,107,.38);
        }
        .btn-danger:hover{
            background: rgba(255,107,107,.22);
            border-color: rgba(255,107,107,.55);
        }
        .btn-ghost{
            background: transparent;
            border-color: transparent;
            color: var(--muted);
        }
        .btn-ghost:hover{
            background: rgba(255,255,255,.06);
            border-color: rgba(255,255,255,.12);
            color: var(--text);
        }

        .users-empty{
            padding: 14px 16px;
            border: 1px dashed var(--border2);
            border-radius: 12px;
            color: var(--muted);
            background: rgba(0,0,0,.12);
        }

        .user{
            border: 1px solid var(--border);
            border-radius: var(--radius2);
            background: rgba(13,22,38,.45);
            padding: 14px;
            margin-top: 12px;
        }
        .user__top{
            display:flex;
            justify-content: space-between;
            align-items:flex-start;
            gap: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 12px;
        }
        .pill{
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid var(--border2);
            background: rgba(255,255,255,.05);
            font-size: 12px;
            color: var(--muted);
            width: fit-content;
        }
        .pill strong{ color: var(--text); font-weight:800; }

        .user-edit-row{
            display: flex;
            gap: 12px;
            flex-wrap: nowrap;
            align-items: flex-end;
        }
        .user-edit-row .field{ flex: 1 1 0; min-width: 180px; }
        .user-edit-row .actions{ margin-top:0; justify-content:flex-end; }

        details.cars{
            margin-top: 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(0,0,0,.14);
            overflow:hidden;
        }
        details.cars > summary{
            cursor: pointer;
            list-style: none;
            padding: 12px 12px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap: 10px;
            user-select: none;
            background: rgba(0,0,0,.18);
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            font-size: 13px;
        }
        details.cars > summary::-webkit-details-marker{ display:none; }
        .cars-body{ padding: 12px; }

        /* tables (общие стили) */
        table{
            width:100%;
            border-collapse: separate;
            border-spacing:0;
            overflow:hidden;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(0,0,0,.12);
            margin-top: 10px;
        }
        thead th{
            text-align:left;
            font-size: 12px;
            color: var(--muted);
            font-weight: 800;
            padding: 10px 10px;
            background: rgba(0,0,0,.22);
            border-bottom: 1px solid var(--border);
        }
        tbody td{
            padding: 10px 10px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            vertical-align: top;
        }
        tbody tr:last-child td{ border-bottom:none; }

        .muted{ color: var(--muted); }
        .inline{ display:inline; margin:0; }

        @media (max-width: 980px){
            .top-grid{ grid-template-columns: 1fr; }
        }
        @media (max-width: 760px){
            .user-edit-row{ flex-wrap: wrap; }
            .user-edit-row .field{ flex: 1 1 100%; min-width: 0; }
            .user-edit-row .actions{ justify-content:flex-start; width: 100%; }
            .btn{ width: 100%; text-align:center; }
        }

        /* --- Color UI (picker + code + swatch) --- */
        .color-row{
            display:flex;
            gap:10px;
            align-items:center;
        }
        .color-picker{
            width: 46px;
            height: 40px;
            padding: 0;
            border-radius: 12px;
            border: 1px solid var(--border2);
            background: rgba(13,22,38,.65);
            cursor: pointer;
            flex: 0 0 auto;
        }
        .color-picker::-webkit-color-swatch-wrapper{ padding: 6px; }
        .color-picker::-webkit-color-swatch{
            border: none;
            border-radius: 10px;
        }
        .color-code{
            flex: 1 1 auto;
            min-width: 120px;
        }
        .color-cell{
            display:flex;
            align-items:center;
            gap:10px;
        }
        .color-swatch{
            width: 18px;
            height: 18px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,.28);
            box-shadow: 0 4px 10px rgba(0,0,0,.25);
            display:inline-block;
            flex: 0 0 auto;
        }

        /* add-car row labels inside cells */
        .cell-field{
            display:flex;
            flex-direction:column;
            gap:6px;
        }
        .cell-field .cell-label{
            font-size: 11px;
            color: var(--muted);
            font-weight: 800;
            line-height: 1;
        }
        .cell-field input[type="text"],
        .cell-field input[type="number"]{
            margin: 0;
        }

        /* cars table layout */
        table.cars-table{
            table-layout: fixed;
        }
        table.cars-table th:nth-child(1),
        table.cars-table td:nth-child(1){ width: 24%; }
        table.cars-table th:nth-child(2),
        table.cars-table td:nth-child(2){ width: 24%; }
        table.cars-table th:nth-child(3),
        table.cars-table td:nth-child(3){ width: 12%; }
        table.cars-table th:nth-child(4),
        table.cars-table td:nth-child(4){ width: 28%; }
        table.cars-table th:nth-child(5),
        table.cars-table td:nth-child(5){ width: 12%; }

        .cars-actions-cell{
            vertical-align: bottom !important;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Управление пользователями и машинами</h1>

    <!-- flash from RedirectAttributes -->
    <div class="flash error" th:if="${error != null}" th:text="${error}"></div>
    <div class="flash success" th:if="${success != null}" th:text="${success}"></div>

    <div class="top-grid">

        <section class="card">
            <div class="card__head">
                <h2>Создать пользователя</h2>
            </div>
            <div class="card__body">
                <form th:action="@{/users}" method="post" class="form">
                    <div class="field">
                        <label for="firstName">Имя</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>

                    <div class="field">
                        <label for="lastName">Фамилия</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="actions">
                        <button class="btn btn-primary" type="submit">Создать</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="card">
            <div class="card__head">
                <h2>Поиск пользователей</h2>
            </div>
            <div class="card__body">
                <form th:action="@{/users}" method="get" class="form">
                    <div class="field">
                        <label>Email</label>
                        <input type="text" name="email" th:value="${filterEmail}">
                    </div>

                    <div class="field">
                        <label>Имя</label>
                        <input type="text" name="firstName" th:value="${filterFirstName}">
                    </div>

                    <div class="field">
                        <label>Фамилия</label>
                        <input type="text" name="lastName" th:value="${filterLastName}">
                    </div>

                    <div class="field">
                        <label>Бренд</label>
                        <input type="text" name="brand" th:value="${filterBrand}">
                    </div>

                    <div class="field">
                        <label>Модель</label>
                        <input type="text" name="model" th:value="${filterModel}">
                    </div>

                    <div class="field">
                        <label>Год</label>
                        <input type="number" name="year" min="1" th:value="${filterYear}">
                    </div>

                    <div class="field">
                        <label>Цвет (код, например #ff0000)</label>
                        <input type="text" name="color" placeholder="#rrggbb" th:value="${filterColor}">
                    </div>

                    <div class="actions">
                        <button class="btn btn-primary" type="submit">Поиск</button>
                        <a class="btn btn-ghost" th:href="@{/users}">Сброс</a>
                    </div>
                </form>
            </div>
        </section>

    </div>

    <section class="card">
        <div class="card__head">
            <h2>Пользователи</h2>
            <span class="muted" th:if="${users != null}">
                Всего: <span th:text="${#lists.size(users)}"></span>
            </span>
        </div>

        <div class="card__body">

            <div class="users-empty" th:if="${users == null or #lists.isEmpty(users)}">
                Пользователей пока нет.
            </div>

            <div th:each="user : ${users}" class="user">

                <div class="user__top">
                    <div>
                        <div class="pill">
                            <span>ID:</span> <strong th:text="${user.id}"></strong>
                        </div>
                        <div class="muted" style="margin-top:6px; font-size:12px;">
                            Редактирование пользователя и машины ниже
                        </div>
                    </div>

                    <form class="inline" th:action="@{/users/{id}/delete(id=${user.id})}" method="post">
                        <button class="btn btn-danger" type="submit" onclick="return confirm('Удалить пользователя?')">
                            Удалить
                        </button>
                    </form>
                </div>

                <form th:action="@{/users/{id}/update(id=${user.id})}" method="post">
                    <div class="user-edit-row">
                        <div class="field">
                            <label>Имя</label>
                            <input type="text" name="firstName" th:value="${user.firstName}" required>
                        </div>

                        <div class="field">
                            <label>Фамилия</label>
                            <input type="text" name="lastName" th:value="${user.lastName}" required>
                        </div>

                        <div class="field">
                            <label>Email</label>
                            <input type="email" name="email" th:value="${user.email}" required>
                        </div>

                        <div class="actions">
                            <button class="btn btn-primary" type="submit">Сохранить</button>
                        </div>
                    </div>
                </form>

                <details class="cars" th:attr="data-user-id=${user.id}">
                    <summary>
                        <span>Машины пользователя</span>
                        <span class="muted" style="font-weight:600;">нажми, чтобы загрузить</span>
                    </summary>

                    <div class="cars-body">
                        <div class="muted cars-status">Ещё не загружено.</div>

                        <!-- Сюда подставится HTML из /users/{id}/cars-fragment -->
                        <div class="cars-table-host"></div>
                    </div>
                </details>

            </div>
        </div>
    </section>

</div>

<script>
    async function fetchUserCarsFragment(userId) {
        const resp = await fetch(`/users/${userId}/cars-fragment`, {
            method: 'GET',
            headers: { 'Accept': 'text/html' }
        });

        if (!resp.ok) {
            const text = await resp.text().catch(() => '');
            throw new Error(`HTTP ${resp.status}: ${text || 'Failed to load cars fragment'}`);
        }
        return await resp.text();
    }

    function normalizeHex(value) {
        if (!value) return null;
        const v = value.trim();
        const m = v.match(/^#([0-9a-fA-F]{6})$/);
        return m ? ("#" + m[1].toLowerCase()) : null;
    }

    function bindColorControls(root) {
        root.querySelectorAll('.color-row').forEach(row => {
            const picker = row.querySelector('.color-picker');
            const code = row.querySelector('.color-code');
            if (!picker || !code) return;

            picker.addEventListener('input', () => {
                code.value = picker.value;
            });

            code.addEventListener('input', () => {
                const hex = normalizeHex(code.value);
                if (hex) picker.value = hex;
            });

            const init = normalizeHex(code.value) || picker.value || '#6ea8fe';
            picker.value = init;
            code.value = init;
        });
    }

    document.querySelectorAll('details.cars').forEach(details => {
        let loaded = false;

        details.addEventListener('toggle', async () => {
            if (!details.open) return;

            const userId = details.getAttribute('data-user-id');
            const statusEl = details.querySelector('.cars-status');
            const host = details.querySelector('.cars-table-host');

            if (!userId) {
                statusEl.textContent = 'Ошибка: userId отсутствует в data-user-id.';
                statusEl.style.color = 'rgba(255,107,107,.95)';
                return;
            }

            if (loaded) return;

            statusEl.style.color = '';
            statusEl.textContent = 'Загружаю машины...';

            try {
                const html = await fetchUserCarsFragment(userId);
                host.innerHTML = html;
                bindColorControls(host);
                statusEl.textContent = '';
                loaded = true;
            } catch (e) {
                statusEl.textContent = 'Не удалось загрузить машины.';
                statusEl.style.color = 'rgba(255,107,107,.95)';
                console.error(e);
            }
        });
    });
</script>

</body>
</html>
